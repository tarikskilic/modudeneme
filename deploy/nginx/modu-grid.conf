# /etc/nginx/sites-available/modu-grid
# Symlink: ln -s /etc/nginx/sites-available/modu-grid /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name modu-grid.com www.modu-grid.com;

    root /var/www/modu-grid;
    index index.html;

    # SPA — React Router client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
